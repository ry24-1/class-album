<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<link rel="icon" href="favicon.ico"/>
	<link rel="stylesheet" href="assets/style.css"/>
	<title>忆班级故往风情 | 一册青春，共览一时念想</title>
	<style>
		*{margin:0;padding:0;box-sizing:border-box;}
		html{scroll-behavior:smooth;}
		body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;line-height:1.7;overflow-x:hidden;}
		nav{position:fixed;top:0;left:0;width:100%;padding:2rem 3.5rem;z-index:998;}
		nav a{color:var(--text-primary);text-decoration:none;font-size:0.95rem;margin-right:2.5rem;opacity:var(--nav-opacity);}
		nav a:hover{opacity:1;letter-spacing:1px;}
		.album-wrap{padding:8rem 2rem 6rem;}
		.album-head{text-align:center;margin-bottom:4rem;}
		.album-h1{font-size:2.6rem;letter-spacing:6px;font-weight:bold;margin-bottom:0.6rem;color:var(--text-primary);}
		.album-sub{color:var(--text-secondary);font-size:1rem;}
		.album-grid{max-width:1440px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill, minmax(310px,1fr));gap:2.8rem;}
		.album-card{height:400px;border-radius:12px;overflow:hidden;position:relative;cursor:pointer;background:var(--bg-card);box-shadow:0 8px 25px var(--shadow-card);transition:transform 0.3s ease, box-shadow 0.3s ease;}
		.album-card:hover{transform:translateY(-10px);box-shadow:0 15px 40px var(--shadow-card);}
		.album-card img{width:100%;height:100%;object-fit:cover;display:block;}
		.card-mask{position:absolute;left:0;bottom:0;width:100%;padding:3rem 1.6rem 1.6rem;background:linear-gradient(transparent, var(--mask-gradient-bottom));}
		.card-name{font-size:1.5rem;font-weight:bold;margin-bottom:0.5rem;color:var(--text-primary);}
		.card-desc{font-size:0.9rem;color:var(--text-secondary);}
		@media (max-width:768px){
			nav{padding:1.2rem 1rem;}
			nav a{margin-right:1rem;font-size:0.8rem;}
			.album-h1{font-size:1.8rem;}
			.album-card{height:280px;}
		}
	</style>
</head>
<body>
	<button class="theme-switch" id="themeBtn"></button>
	<nav>
		<a href="index.html">首页·忆起故往风情</a>
		<a href="albums.html">相册·共览一时念想</a>
		<a href="eyes.html">视角·望见ta的眼睛</a>
	</nav>
	<div class="album-wrap">
		<div class="album-head">
			<h2 class="album-h1">共览一时念想</h2>
			<p class="album-sub">一本相册，一段无法复刻的少年时光</p>
		</div>
		<div class="album-grid">
			<div class="album-card" onclick="location.href='album.html?album=sports'">
				<img src="album/001.webp" alt="秋季运动会">
				<div class="card-mask">
					<div class="card-name">秋季运动会</div>
					<div class="card-desc">2025.10 | 共计27张照片</div>
				</div>
			</div>
			<div class="album-card" onclick="location.href='album.html?album=grad'">
				<img src="album/002.webp" alt="毕业留影">
				<div class="card-mask">
					<div class="card-name">毕业留影</div>
					<div class="card-desc">2026.07 | 共计35张照片</div>
				</div>
			</div>
			<div class="album-card" onclick="location.href='album.html?album=classroom'">
				<img src="album/003.webp" alt="教室日常">
				<div class="card-mask">
					<div class="card-name">教室日常碎片</div>
					<div class="card-desc">晚自习与课间瞬间 | 共计41张照片</div>
				</div>
			</div>
		</div>
	</div>
	<script src="assets/script.js"></script>
</body>
</html>
